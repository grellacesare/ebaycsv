[project]
name = "motorworld-csv"
version = "0.1.0"
description = "Motor World supplier CSV workspace"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3", "python-multipart>=0.0.18", "jinja2>=3.1,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
